<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Exemple</title>
    <!--
      Plugin « exemple » du mode mock : montre l'iframe et le SDK sans back. Ses couleurs
      viennent du thème transmis par Cadence (variables CSS posées par le SDK).
    -->
    <style>
      body {
        margin: 0;
        padding: 22px 26px;
        background: var(--color-bg);
        color: var(--color-tx);
        font: 13px/1.6 "IBM Plex Sans", system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 4px;
        font: 600 17px "Space Grotesk", sans-serif;
      }
      p.muted {
        margin: 0 0 18px;
        color: var(--color-tx3);
      }
      .card {
        border: 1px solid var(--color-line);
        background: var(--color-panel);
        border-radius: var(--radius-card);
        padding: 14px 16px;
        margin-bottom: 12px;
        max-width: 640px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      button {
        height: 30px;
        padding: 0 12px;
        border-radius: var(--radius-control);
        border: 1px solid var(--color-line2);
        background: var(--color-p3);
        color: var(--color-tx);
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: var(--color-clay);
        color: var(--color-clay-ink);
        border-color: transparent;
        font-weight: 600;
      }
      code,
      .mono {
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        color: var(--color-tx2);
      }
      .label {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--color-tx3);
        margin-bottom: 8px;
      }
      .error {
        color: var(--color-red);
      }
    </style>
  </head>
  <body>
    <h1 id="title">Exemple</h1>
    <p class="muted">Vue <code id="view">…</code> · interface fournie par le plugin, dans une iframe isolée.</p>

    <div class="card">
      <div class="label">Outil du serveur et événement</div>
      <div class="row">
        <button class="primary" id="inc">Incrémenter</button>
        <span>Compteur : <strong id="count">0</strong></span>
        <span class="mono" id="event"></span>
      </div>
    </div>

    <div class="card">
      <div class="label">Autres appels</div>
      <div class="row">
        <button id="time">Heure du serveur</button>
        <button id="fail">Outil en erreur</button>
        <button id="notify">Notifier</button>
        <button id="nav">Aller à l'autre vue</button>
      </div>
      <p class="mono" id="out" style="margin: 10px 0 0"></p>
    </div>

    <div class="card">
      <div class="label">Stockage d'interface</div>
      <div class="row">
        <button id="save">Mémoriser l'heure</button>
        <span class="mono" id="stored"></span>
      </div>
    </div>

    <script src="../cadence-sdk.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      const show = (route) => {
        $("view").textContent = route.view || "accueil";
        $("nav").textContent = route.view === "outils" ? "Aller à l'accueil" : "Aller aux outils";
      };
      const out = (text, error) => {
        $("out").textContent = text;
        $("out").className = error ? "mono error" : "mono";
      };

      cadence.ready.then(async (info) => {
        $("title").textContent = `Exemple · v${info.plugin.version}`;
        show(info.route);
        const stored = await cadence.storage.get("derniere");
        $("stored").textContent = stored ? `mémorisé : ${stored}` : "rien de mémorisé";
      });
      cadence.on("route", show);
      cadence.on("compteur.change", (data) => {
        $("event").textContent = `événement compteur.change → ${data.valeur}`;
      });

      $("inc").onclick = async () => {
        const r = await cadence.call("compteur", { pas: 1 });
        $("count").textContent = r.valeur;
      };
      $("time").onclick = async () => out(`heure : ${(await cadence.call("heure")).iso}`);
      $("fail").onclick = async () => {
        try {
          await cadence.call("erreur");
        } catch (e) {
          out(`${e.code} : ${e.message}`, true);
        }
      };
      $("notify").onclick = () => cadence.notify("Bonjour depuis le plugin Exemple", "success");
      $("nav").onclick = () => cadence.navigate(cadence.route.view === "outils" ? "accueil" : "outils");
      $("save").onclick = async () => {
        const now = new Date().toLocaleTimeString("fr-FR");
        await cadence.storage.set("derniere", now);
        $("stored").textContent = `mémorisé : ${now}`;
      };
    </script>
  </body>
</html>
