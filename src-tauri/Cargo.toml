[package]
name = "cadence"
version = "0.1.0"
description = "Cockpit de projet logiciel adossé à GitHub"
authors = ["Rémi Lhuillier"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cadence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
semver = "1.0.28"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = { version = "12.0.1", features = ["serde-compat", "serde-json-impl"] }
tokio = { version = "1.53.3", features = ["sync", "time", "macros", "process", "net", "io-util"] }
which = "8.0.6"
secrecy = "0.10.3"
tauri-plugin-dialog = "2.8.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls", "http2"] }
keyring = "4.2.0"
getrandom = "0.4.3"
sha2 = "0.11.1"
base64 = "0.23.1"
url = "2.5.8"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio"] }
toml = "1.1.8"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Mise à jour automatique (releases GitHub signées, voir docs/release.md) et redémarrage
# après installation. Desktop seulement.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
