[package]
name = "cadence"
version = "0.3.0"
description = "Cockpit de projet logiciel adossé à GitHub"
authors = ["Rémi Lhuillier"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cadence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
semver = "1.0.28"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = { version = "12.0.1", features = ["serde-compat", "serde-json-impl"] }
tokio = { version = "1.53.3", features = ["sync", "time", "macros", "process", "net", "io-util", "fs", "rt-multi-thread"] }
which = "8.0.6"
secrecy = "0.10.3"
tauri-plugin-dialog = "2.8.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls", "http2"] }
keyring = "4.2.0"
getrandom = "0.4.3"
sha2 = "0.11.1"
base64 = "0.23.1"
url = "2.5.8"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio"] }
toml = "1.1.8"
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# MCP : client des serveurs de plugin (stdio) et passerelle des IA (streamable HTTP, axum).
rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-async-rw", "server", "transport-streamable-http-server"] }
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1"] }
http = "1.5.0"
# Processus des serveurs de plugin : job object (Windows) ou groupe (Unix).
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "kill-on-drop", "job-object", "creation-flags", "process-group"] }
portable-pty = "0.9"


[target.'cfg(windows)'.dependencies]
# `CREATE_NO_WINDOW` pour les serveurs de plugin (pas de console qui s'ouvre).
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }

[dev-dependencies]
# Serveur MCP du binaire de test `fake-plugin` (examples/fake-plugin.rs).
# Client HTTP des tests de la passerelle (tests/gateway.rs).
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io", "transport-streamable-http-client-reqwest"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Mise à jour automatique (releases GitHub signées, voir docs/release.md) et redémarrage
# après installation. Desktop seulement.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
